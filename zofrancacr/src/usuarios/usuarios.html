<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoFrancaCR - Gesti&oacute;n de Usuarios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="usuarios.css">
</head>
<body class="app-page users-page bg-slate-50 flex min-h-screen text-slate-800">

  <div id="bootSkeleton" class="boot-skeleton">
    <div class="boot-skeleton__card">
      <span class="boot-skeleton__spinner"></span>
      <p>Verificando acceso&#8230;</p>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="app-sidebar w-64 bg-[#051E3C] text-slate-300 flex flex-col justify-between p-4 flex-shrink-0">
    <div>
      <div class="app-brand flex items-center gap-3 px-2 py-4 mb-4">
        <div class="app-brand__mark" aria-hidden="true">
          <span class="app-brand__mark-core">ZF</span>
          <span class="app-brand__mark-orbit"></span>
        </div>
        <span class="app-brand__name"><strong>ZO</strong><em>FRANCA</em><small>COSTA RICA</small></span>
      </div>
      <nav class="space-y-1">
        <a href="../dashboard/dashboard.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-800 rounded-lg text-xs font-medium">
          <i data-lucide="layout-grid" class="w-4 h-4"></i> Dashboard
        </a>
        <a href="../usuarios/usuarios.html" class="flex items-center gap-3 px-3 py-2.5 bg-sky-600 text-white rounded-lg text-xs font-medium">
          <i data-lucide="user-cog" class="w-4 h-4"></i> Usuarios
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-800 rounded-lg text-xs font-medium">
          <i data-lucide="settings" class="w-4 h-4"></i> Configuraci&oacute;n
        </a>
      </nav>
    </div>
  </aside>

  <!-- Contenido principal -->
  <main id="appContent" class="flex-1 flex flex-col min-w-0">
    <header class="app-header h-16 bg-white border-b flex items-center justify-between px-8">
      <div class="relative w-80 max-w-full">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
        <input type="text" placeholder="Buscar..." class="w-full pl-9 pr-3 py-1.5 bg-slate-100 rounded-lg text-xs outline-none">
      </div>
      <div class="flex items-center gap-3">
        <div class="text-right">
          <p id="headerUserName" class="text-xs font-bold text-slate-800">Cargando&#8230;</p>
          <p id="headerUserRole" class="text-[10px] text-slate-400"></p>
        </div>
        <div class="w-8 h-8 bg-[#051E3C] text-white rounded-lg flex items-center justify-center">
          <i data-lucide="user" class="w-4 h-4"></i>
        </div>
        <a id="logoutBtn" href="../login/login.html" class="text-rose-500 hover:bg-rose-50 p-2 rounded-lg">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </a>
      </div>
    </header>

    <div class="app-content p-8 space-y-6 flex-1">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">Gesti&oacute;n de Usuarios</h1>
          <p class="text-sm text-slate-500 mt-1">Administra los registros y aprueba o rechaza las cuentas pendientes.</p>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <button id="refreshBtn" class="app-button app-button--secondary px-3 py-1.5 border rounded-lg flex items-center gap-1.5 text-slate-600 hover:bg-slate-50">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Actualizar
          </button>
        </div>
      </div>

      <div class="app-panel bg-white rounded-xl border overflow-hidden">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 text-slate-500 border-b">
            <tr>
              <th class="p-3">Nombre</th>
              <th class="p-3">Correo Electr&oacute;nico</th>
              <th class="p-3">Rol</th>
              <th class="p-3">Estado</th>
              <th class="p-3">Acciones</th>
            </tr>
          </thead>
          <tbody id="usersBody" class="divide-y text-slate-600"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="./usuarios.js"></script>
</body>
</html>
